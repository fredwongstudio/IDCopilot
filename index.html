<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="description" content="IDCopilot — your AI Interior Design Copilot for turning your home, lifestyle and design preferences into a personalised interior concept.">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IDCopilot — AI Interior Design Copilot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root{
    --ink:#17202a;
    --paper:#f4f5f7;
    --blueprint:#111827;
    --blueprint-light:#2b3440;
    --line:#e0e4e8;
    --amber:#111827;
    --amber-dark:#111827;
    --ok:#087f5b;
    --card:#ffffff;
    --muted:#68737d;
    --radius:12px;
    --soft:#fafbfc;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:18px 12px;
  }

  .device{
    width:100%;
    max-width:420px;
    background:var(--card);
    border-radius:14px;
    border:1px solid #e0e4e8;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-height:760px;
  }

  /* Header / ruler progress */
  .topbar{
    background:var(--blueprint);
    color:#fff;
    padding:18px 20px 22px;
  }
  .brand{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
  }
  .brand-name{
    font-weight:700; font-size:15px; letter-spacing:0.02em;
  }
  .brand-name .dot{ color:var(--amber); }
  .step-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:#B9C7D6;
    letter-spacing:0.03em;
  }
  .ruler{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:22px;
  }
  .tick{
    flex:1;
    background:rgba(255,255,255,0.22);
    height:8px;
    border-radius:2px;
    position:relative;
    transition:all .25s ease;
  }
  .tick.done{ background:var(--amber); height:14px; }
  .tick.active{ background:#fff; height:22px; }
  .tick-num{
    position:absolute;
    top:-16px;
    left:50%;
    transform:translateX(-50%);
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    color:#B9C7D6;
    display:none;
  }
  .tick.active .tick-num{ display:block; color:#fff; }

  /* Content */
  .screen{
    padding:28px 22px 22px;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--amber-dark);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:8px;
  }
  h1{
    font-size:22px;
    margin:0 0 8px;
    line-height:1.25;
  }
  .sub{
    color:var(--muted);
    font-size:13.5px;
    line-height:1.5;
    margin:0 0 22px;
  }

  .field-label{
    font-size:12px;
    font-weight:600;
    color:var(--ink);
    margin:0 0 8px;
    display:block;
  }
  .chip-row{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;
  }
  .chip{
    padding:9px 14px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:#fff;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
    color:var(--ink);
    transition:all .15s ease;
  }
  .chip:hover{ border-color:var(--blueprint-light); }
  .chip.selected{
    background:var(--blueprint);
    border-color:var(--blueprint);
    color:#fff;
  }

  .upload-box{
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    padding:28px 16px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    cursor:pointer;
    margin-bottom:20px;
    transition:all .15s ease;
  }
  .upload-box:hover{ border-color:var(--amber); color:var(--amber-dark); }
  .upload-box.filled{
    border-style:solid;
    border-color:var(--ok);
    color:var(--ok);
    background:#f2f8f5;
  }
  .upload-box svg{ margin-bottom:8px; }

  /* Floor plan calibration mock */
  .plan-wrap{
    position:relative;
    border-radius:var(--radius);
    border:1.5px solid var(--line);
    background:#fff;
    margin-bottom:14px;
    overflow:hidden;
  }
  .plan-hint{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    padding:8px 12px;
    background:var(--soft);
    border-bottom:1px solid var(--line);
  }
  .room-dot{
    position:absolute;
    width:26px; height:26px;
    border-radius:50%;
    background:var(--amber);
    border:2px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:center;
    font-size:8.5px; color:#fff; font-weight:700;
    cursor:pointer;
  }
  .calib-input-row{
    display:flex; gap:8px; margin-bottom:20px;
  }
  .calib-input-row input{
    flex:1;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
  }

  .stepper-row{
    display:flex; align-items:center; gap:14px; margin-bottom:20px;
  }
  .stepper-btn{
    width:36px; height:36px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    font-size:16px;
    cursor:pointer;
    color:var(--blueprint);
  }
  .stepper-val{
    font-family:'JetBrains Mono', monospace;
    font-size:16px;
    min-width:24px;
    text-align:center;
  }

  .toggle-row{
    display:flex; gap:8px; margin-bottom:18px;
  }
  .toggle-row .chip{ flex:1; text-align:center; }

  .member-row{
    padding-bottom:2px;
  }
  .member-row-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:8px;
  }

  .conditional-block{
    background:var(--soft);
    border:1px solid var(--line);
    border-left:3px solid var(--amber);
    border-radius:10px;
    padding:14px 14px 4px;
    margin:-4px 0 20px;
  }
  .text-input{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-family:inherit;
    font-size:13px;
    margin-bottom:14px;
    background:#fff;
  }
  .textarea-input{
    min-height:70px;
    resize:vertical;
    line-height:1.4;
  }

  .q-block{ margin-bottom:4px; }

  .inspo-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    margin-top:10px;
    margin-bottom:20px;
  }
  .inspo-thumb{
    position:relative;
    aspect-ratio:1/1;
    border-radius:10px;
    background:linear-gradient(135deg, #E8E4DB, #C9D3DC);
    border:1.5px solid var(--line);
    display:flex;
    align-items:flex-end;
    padding:6px;
  }
  .inspo-name{
    font-size:9px;
    color:var(--ink);
    background:rgba(255,255,255,0.75);
    padding:2px 5px;
    border-radius:4px;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .inspo-remove{
    position:absolute;
    top:5px; right:5px;
    width:18px; height:18px;
    border-radius:50%;
    background:rgba(22,35,58,0.7);
    color:#fff;
    font-size:12px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  .style-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:16px;
  }
  .style-photo-card{ cursor:pointer; }
  .style-photo{
    position:relative;
    aspect-ratio:3/4;
    border-radius:12px;
    overflow:hidden;
    border:2px solid transparent;
    display:flex;
    align-items:flex-end;
    transition:all .15s ease;
  }
  .style-photo-card.selected .style-photo{
    border-color:var(--amber);
    box-shadow:0 4px 14px -4px rgba(201,134,47,0.5);
  }
  .style-check{
    position:absolute;
    top:8px; right:8px;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--amber);
    color:#fff;
    font-size:12px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .style-caption{
    width:100%;
    padding:10px 10px 9px;
    background:linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
  }
  .style-name{ color:#fff; font-size:12.5px; font-weight:700; }
  .style-desc{ color:rgba(255,255,255,0.85); font-size:10px; margin-top:1px; }

  .budget-card, .theme-card{
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .budget-card.selected, .theme-card.selected{
    border-color:var(--lavender);
    background:var(--lavender-soft);
  }
  .budget-card .amt{ font-family:'JetBrains Mono', monospace; font-weight:600; font-size:14px; }
  .budget-card .desc{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  .theme-card{ display:flex; align-items:center; gap:12px; }
  .swatch-set{ display:flex; gap:3px; }
  .swatch{ width:14px; height:14px; border-radius:3px; }
  .theme-name{ font-weight:600; font-size:13.5px; }
  .theme-desc{ font-size:11.5px; color:var(--muted); }

  /* Generating */
  .gen-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .spinner{
    width:56px; height:56px;
    border-radius:50%;
    border:4px solid var(--line);
    border-top-color:var(--amber);
    animation:spin 1s linear infinite;
    margin-bottom:20px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .gen-status{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    margin-top:6px;
  }

  /* Results */
  .result-plan{
    border-radius:var(--radius);
    border:1.5px solid var(--line);
    background:#fff;
    padding:0;
    margin-bottom:16px;
    overflow:hidden;
  }
  .result-section-label{
    font-size:11px;
    font-family:'JetBrains Mono', monospace;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    margin:0 0 10px;
  }
  .palette-row{ display:flex; gap:8px; margin-bottom:18px; }
  .palette-sw{
    flex:1; height:44px; border-radius:8px;
  }
  .cost-card{
    background:var(--blueprint);
    color:#fff;
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:18px;
  }
  .cost-card .amt{
    font-family:'JetBrains Mono', monospace;
    font-size:24px;
    font-weight:600;
    margin:4px 0 2px;
  }
  .cost-card .cap{ font-size:11px; color:#B9C7D6; }

  /* Footer nav */
  .summary-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
  }
  .summary-item{
    background:var(--soft);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:13px;
    font-weight:600;
  }
  .summary-label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-weight:400;
    margin-bottom:3px;
  }

  .footer{
    padding:16px 22px 22px;
    display:flex;
    gap:10px;
    border-top:1px solid var(--line);
  }
  .btn{
    flex:1;
    padding:13px 16px;
    border-radius:12px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    border:none;
  }
  .btn-primary{ background:var(--amber); color:#fff; }
  .btn-primary:hover{ background:var(--amber-dark); }
  .btn-secondary{ background:#fff; color:var(--ink); border:1.5px solid var(--line); flex:0 0 90px; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .date-row{ margin-bottom:14px; }
  .date-summary{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--soft);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    margin-bottom:4px;
  }
  .date-summary-arrow{ color:var(--muted); }
  .date-summary-label{
    display:block;
    font-size:9.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:2px;
  }
  .handover-card{
    background:var(--blueprint);
    color:#fff;
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:4px;
  }
  .handover-card .amt{
    font-family:'JetBrains Mono', monospace;
    font-size:17px;
    font-weight:600;
    margin:4px 0 2px;
  }
  .handover-card .cap{ font-size:11px; color:#B9C7D6; }

  .legend-row{
    display:flex; flex-wrap:wrap; gap:10px 14px;
    margin-bottom:16px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .legend-item{
    display:flex; align-items:center; gap:5px;
    font-size:10.5px; color:var(--muted);
    font-family:'JetBrains Mono', monospace;
  }
  .legend-dot{ width:8px; height:8px; border-radius:2px; display:inline-block; }

  .gantt-list{ margin-bottom:6px; }
  .gantt-row{
    display:grid;
    grid-template-columns:98px 1fr 44px;
    align-items:center;
    gap:8px;
    margin-bottom:9px;
  }
  .gantt-name{
    font-size:11.5px;
    font-weight:600;
    line-height:1.25;
  }
  .gantt-track{
    position:relative;
    height:10px;
    background:#EEECE6;
    border-radius:4px;
    overflow:hidden;
  }
  .gantt-bar{
    position:absolute;
    top:0; bottom:0;
    border-radius:4px;
  }
  .gantt-day{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    color:var(--muted);
    text-align:right;
  }

  .render-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:16px;
  }
  .render-card{ display:flex; flex-direction:column; gap:6px; }
  .render-box{
    aspect-ratio:4/3;
    border-radius:12px;
    border:1.5px solid var(--line);
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:flex-end;
    justify-content:flex-start;
  }
  .render-box.pending{
    background:#EEECE6;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:8px;
  }
  .shimmer{
    width:60%; height:8px;
    border-radius:4px;
    background:linear-gradient(90deg, #DEDCD4 25%, #F3F1EA 37%, #DEDCD4 63%);
    background-size:400% 100%;
    animation:shimmer 1.4s ease infinite;
  }
  @keyframes shimmer{
    0%{ background-position:100% 50%; }
    100%{ background-position:0 50%; }
  }
  .render-status-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--muted);
  }
  .render-tag{
    background:rgba(22,35,58,0.55);
    color:#fff;
    font-size:10px;
    font-family:'JetBrains Mono', monospace;
    padding:4px 8px;
    border-radius:6px;
    margin:8px;
  }
  .render-caption{
    font-size:11.5px;
    font-weight:600;
    color:var(--ink);
  }

  .dim-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    font-weight:700;
    color:var(--ok);
    text-align:center;
  }
  .dim-label-top{ margin-bottom:4px; }
  .dim-label-left{
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    display:flex;
    align-items:center;
    padding-right:6px;
  }

  .brief-accordion{ margin-bottom:6px; }
  .brief-item{
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:8px;
    overflow:hidden;
  }
  .brief-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    cursor:pointer;
    background:var(--soft);
  }
  .brief-header-label{ font-size:13.5px; font-weight:600; }
  .brief-header-chevron{
    font-family:'JetBrains Mono', monospace;
    font-size:16px;
    color:var(--amber-dark);
    font-weight:700;
  }
  .brief-body{ padding:14px; border-top:1px solid var(--line); }

  .detect-list{ margin-bottom:16px; }
  .detect-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .detect-text-block{ flex:1; }
  .detect-ocr{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--muted);
    margin-bottom:4px;
  }
  .detect-select{
    width:100%;
    padding:8px 10px;
    border-radius:8px;
    border:1.5px solid var(--line);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    background:#fff;
  }
  .detect-conf{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    font-weight:700;
    padding:4px 8px;
    border-radius:6px;
    flex:0 0 auto;
  }
  .detect-conf.high{ background:#E9F3EC; color:var(--ok); }
  .detect-conf.mid{ background:#FBF3E7; color:var(--amber-dark); }
  .detect-conf.low{ background:#FBEAE7; color:#B44B3B; }

  .note{
    font-size:11.5px;
    color:var(--muted);
    background:var(--soft);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-top:2px;
    margin-bottom:18px;
  }

/* =========================================================
   Responsive Web App Layer
   Mobile-first, tablet and desktop
   ========================================================= */

* { box-sizing: border-box; }

html {
  width: 100%;
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  width: 100%;
  min-width: 320px;
  overflow-x: hidden;
}

button, input, textarea, select {
  max-width: 100%;
  font: inherit;
}

img, svg {
  max-width: 100%;
}

.app {
  width: 100%;
  min-height: 100vh;
}

.shell {
  width: min(100%, 1180px);
  margin: 0 auto;
  padding-left: clamp(16px, 3vw, 32px);
  padding-right: clamp(16px, 3vw, 32px);
}

.main,
.content,
.page,
.panel {
  min-width: 0;
}

.stepper,
.progress,
.nav,
.topbar {
  max-width: 100%;
}

/* Cards and grids should never force horizontal scrolling */
.style-grid,
.inspo-grid,
.render-grid,
.summary-row,
.palette-row,
.chip-row,
.option-grid,
.card-grid,
.brief-accordion {
  width: 100%;
  min-width: 0;
}

.style-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr));
  gap: 12px;
}

.render-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
  gap: 12px;
}

.inspo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 10px;
}

.summary-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.summary-item {
  min-width: 0;
  overflow-wrap: anywhere;
}

.result-plan,
.result-card,
.cost-card,
.handover-card,
.note,
.brief-item,
.render-card {
  min-width: 0;
  max-width: 100%;
}

.result-plan svg {
  width: 100%;
  height: auto;
}

textarea {
  width: 100%;
  resize: vertical;
}

.text-input {
  width: 100%;
  min-width: 0;
}

.btn {
  min-height: 44px;
  touch-action: manipulation;
}

.chip {
  min-height: 42px;
  touch-action: manipulation;
}

.upload-box {
  min-height: 92px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 18px;
  cursor: pointer;
}

.style-photo-card {
  min-width: 0;
}

.style-photo {
  min-height: 210px;
}

.render-box {
  width: 100%;
  aspect-ratio: 4 / 3;

function handleFloorPlanUpload(event){
  const file = event.target.files[0];
  if(!file) return;

  // Real phone photos are often 3-10MB+, and base64 adds ~33% overhead on top of that —
  // well past Vercel's hard 4.5MB serverless function body limit. Resize/compress client-side
  // before it ever becomes a data URL, so uploads work reliably regardless of source device.
  const img = new Image();
  const objectUrl = URL.createObjectURL(file);
  img.onload = function(){
    const MAX_DIM = 1600;
    let { width, height } = img;
    if(width > MAX_DIM || height > MAX_DIM){
      if(width > height){ height = Math.round(height * (MAX_DIM / width)); width = MAX_DIM; }
      else { width = Math.round(width * (MAX_DIM / height)); height = MAX_DIM; }
    }
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; // flatten transparency (e.g. PNG floor plan exports) onto white before JPEG encode
    ctx.fillRect(0, 0, width, height);
    ctx.drawImage(img, 0, 0, width, height);
    URL.revokeObjectURL(objectUrl);

    let dataUrl = canvas.toDataURL('image/jpeg', 0.82);
    // If still too close to the limit (e.g. a very detailed/busy plan), step quality down further.
    let quality = 0.82;
    while(dataUrl.length > 4.2 * 1024 * 1024 && quality > 0.4){
      quality -= 0.1;
      dataUrl = canvas.toDataURL('image/jpeg', quality);
    }

    state.data.floorPlanImage = dataUrl;
    state.data.floorPlanFileName = file.name;
    state.data.fileUploaded = true;
    state.data.floorPlanAnalysis = null;
    state.data.floorPlanAiStatus = 'idle';
    state.data.floorPlanAiError = null;
    state.data.floorPlanUnderstandingConfirmed = false;
    state.data.calibAutoAttempted = false;
    state.data.calibPoints = [];
    state.data.calibLength = '';
    state.data.calibConfirmed = false;
    render();
  };
  img.onerror = function(){
    URL.revokeObjectURL(objectUrl);
    state.data.floorPlanAiError = 'Could not read that image — please try a different photo or file.';
    render();
  };
  img.src = objectUrl;
}

function setupCalibDrag(){
  const line = document.getElementById('calib-line');
  document.querySelectorAll('.calib-point').forEach(circle => {
    circle.addEventListener('pointerdown', function(e){
      e.preventDefault();
      e.stopPropagation();
      const surface = document.getElementById('calib-surface');
      const idx = parseInt(circle.getAttribute('data-idx'), 10);
      const rect = surface.getBoundingClientRect();
      circle.setAttribute('r', '2.4');

      function toPct(evt){
        return {
          x: Math.max(0, Math.min(100, ((evt.clientX - rect.left) / rect.width) * 100)),
          y: Math.max(0, Math.min(100, ((evt.clientY - rect.top) / rect.height) * 100)),
        };
      }
      function onMove(ev){
        const p = toPct(ev);
        circle.setAttribute('cx', p.x);
        circle.setAttribute('cy', p.y);
        if(line){
          if(idx === 0){ line.setAttribute('x1', p.x); line.setAttribute('y1', p.y); }
          else { line.setAttribute('x2', p.x); line.setAttribute('y2', p.y); }
        }
        state.data.calibPoints[idx] = p;
      }
      function onUp(){
        circle.setAttribute('r', '1.6');
        state.data.calibRect = { w: rect.width, h: rect.height };
        state.data.calibConfirmed = false;
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        render();
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });
}

function handleCalibClick(e){
  const rect = e.currentTarget.getBoundingClientRect();
  const xPct = ((e.clientX - rect.left) / rect.width) * 100;
  const yPct = ((e.clientY - rect.top) / rect.height) * 100;
  if(state.data.calibPoints.length >= 2){
    state.data.calibPoints = [];
    state.data.calibLength = '';
  }
  state.data.calibPoints.push({x: xPct, y: yPct});
  state.data.calibRect = { w: rect.width, h: rect.height };
  state.data.calibConfirmed = false;
  render();
}

function resetCalibration(){
  state.data.calibPoints = [];
  state.data.calibLength = '';
  state.data.calibConfirmed = false;

function analyzeFloorPlan(){
  const d = state.data;
  if(!d.floorPlanImage){
    d.floorPlanAiError = 'Please upload a floor plan first.';
    render();
    return;
  }

  d.floorPlanAiStatus = 'loading';
  d.floorPlanAiError = null;
  render();

  // Production hook:
  // POST the image + current project data to /api/floor-plan-agent.
  // The server should return structured JSON:
  // {summary, property_type, unit_type, spaces, fixed_elements,
  //  opportunities, questions, confidence}
  fetch('/api/floor-plan-agent', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      floor_plan_data_url:d.floorPlanImage,
      project:{
        property_type:d.flatSource,
        unit_type:d.unitType
      }
    })
  })
  .then(r => {
    if(!r.ok) throw new Error('AI endpoint unavailable');
    return r.json();
  })
  .then(result => {
    d.floorPlanAnalysis = result;
    d.floorPlanAiStatus = 'ready';
    render();
  })
  .catch(() => {
    // Demo fallback keeps the HTML prototype usable before the backend is deployed.
    d.floorPlanAnalysis = {
      summary:`I can see this is a ${d.flatSource || 'residential'} floor plan. I’ll use the visible room arrangement as the spatial foundation for your design.`,
      property_type:d.flatSource || 'Not confirmed',
      unit_type:d.unitType || 'Not confirmed',
      spaces:['Living / dining area','Kitchen','Bedroom(s)','Bathroom(s)','Circulation / entry'],
      fixed_elements:['Existing external walls','Visible wet-area positions','Door and window locations where identifiable'],
      opportunities:['Review circulation before furniture placement','Look for integrated storage opportunities','Check kitchen workflow and service access'],
      questions:['Confirm any walls that cannot be altered','Confirm room labels where the plan is unclear'],
      confidence:'Prototype confidence: medium'
    };
    d.floorPlanAiStatus = 'demo';
    d.floorPlanAiError = 'Live AI is not connected yet — showing the prototype analysis.';
    render();
  });
}

function setupFurnitureDrag(){
  document.querySelectorAll('.furniture-item').forEach(g => {
    g.addEventListener('pointerdown', function(e){
      e.preventDefault();
      const svg = g.closest('svg');
      const id = g.getAttribute('data-id');
      const piece = furniturePieces.find(p => p.id === id);
      const startPos = state.data.furniturePositions[id] || {x: piece.x, y: piece.y};

      function toSvgCoords(evt){
        const pt = svg.createSVGPoint();
        pt.x = evt.clientX; pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      const startSvg = toSvgCoords(e);
      const offsetX = startSvg.x - startPos.x;
      const offsetY = startSvg.y - startPos.y;
      g.style.cursor = 'grabbing';
      let liveX = startPos.x, liveY = startPos.y;

      function onMove(ev){
        const cur = toSvgCoords(ev);
        liveX = Math.max(PLAN_BOUNDS.minX, Math.min(PLAN_BOUNDS.maxX - piece.w, cur.x - offsetX));
        liveY = Math.max(PLAN_BOUNDS.minY, Math.min(PLAN_BOUNDS.maxY - piece.h, cur.y - offsetY));
        g.setAttribute('transform', `translate(${liveX - piece.x}, ${liveY - piece.y})`);
      }
      function onUp(){
        state.data.furniturePositions[id] = {x: liveX, y: liveY};
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        g.style.cursor = 'grab';
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });
}

function toggleRenderRoom(room){
  const idx = state.data.renderRooms.indexOf(room);
  if(idx === -1){
    state.data.renderRooms.push(room);
    state.data.renderStatus[room] = 'pending';
    const delay = 1400 + Math.random()*1200;
    setTimeout(() => {
      if(state.data.renderStatus[room] === 'pending'){
        state.data.renderStatus[room] = 'ready';
        render();
      }
    }, delay);
  } else {
    state.data.renderRooms.splice(idx,1);
    delete state.data.renderStatus[room];
  }
  render();
}

async function generateAIDesign(){
  const d = state.data;
  d.aiStatus = 'loading';
  d.aiError = '';
  d.aiBrief = null;
  render();

  const project = buildProjectInput();
  const prompt = buildAIPrompt(project);
  d.aiPrompt = prompt;

  try {
    // Secure production architecture:
    // browser -> /api/design -> Copilot AI/image provider
    // Never place a private API key in this HTML file.
    const response = await fetch('/api/design', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({project, prompt})
    });

    if(!response.ok) throw new Error(`AI endpoint returned ${response.status}`);
    const payload = await response.json();
    if(!payload.brief) throw new Error('AI endpoint did not return a design brief.');

    d.aiBrief = payload.brief;
    d.aiImageUrl = payload.imageUrl || '';
    d.aiStatus = 'done';
  } catch(err) {
    // Offline/demo mode: still demonstrates the complete data -> brief pipeline.
    d.aiBrief = fallbackAIDesign(project);
    d.aiImageUrl = '';
    d.aiStatus = 'demo';
    d.aiError = 'Live AI endpoint not connected — showing the local demo design brain.';
  }

  render();
}


function submitContactForm(){
  const name = document.getElementById('contactName')?.value.trim() || '';
  const email = document.getElementById('contactEmail')?.value.trim() || '';
  const phone = document.getElementById('contactPhone')?.value.trim() || '';
  const message = document.getElementById('contactMessage')?.value.trim() || '';
  const status = document.getElementById('contactFormStatus');

  if(!name || !email){
    if(status){
      status.style.display = 'block';
      status.innerHTML = 'Please enter your name and email so we know how to contact you.';
    }
    return;
  }

  const subject = encodeURIComponent(`IDCopilot enquiry — ${name}`);
  const body = encodeURIComponent(
`Name: ${name}
Email: ${email}
Phone: ${phone || 'Not provided'}

Project:
${message || 'No additional message provided.'}

IDCopilot project:
${JSON.stringify(buildProjectInput(), null, 2)}`
  );

  window.location.href = `mailto:fredwongstudio@gmail.com?subject=${subject}&body=${body}`;
}

    const roomOptions = roomLabels;
    html = `
      <div class="eyebrow">3D room views</div>
      <h1>See any room in 3D</h1>
      <p class="sub">Pick the rooms you want to turn into personalised AI interior visuals.</p>

      <label class="field-label">Select rooms</label>
      <div class="chip-row">
        ${roomOptions.map(r => `
          <button class="chip ${d.renderRooms.includes(r)?'selected':''}" onclick="toggleRenderRoom('${r}')">${r}</button>
        `).join('')}
      </div>

      ${d.renderRooms.length === 0 ? `
        <div class="note">Tap a room above to generate its 3D render.</div>
      ` : `
        <div class="render-grid">
          ${d.renderRooms.map(r => {
            const ready = d.renderStatus[r] === 'ready';
            const palette = (themes.find(t=>t.name===d.theme) || themes[0]).colors;
            return `
            <div class="render-card">
              <div class="render-box ${ready ? 'ready' : 'pending'}" style="${ready ? `background:linear-gradient(135deg, ${palette[0]}, ${palette[1]})` : ''}">
                ${ready ? `<span class="render-tag">3D — ${r}</span>` : `<div class="shimmer"></div><span class="render-status-label">Rendering…</span>`}
              </div>
              <div class="render-caption">${r}${ready ? '' : ' · generating'}</div>
            </div>`;
          }).join('')}
        </div>
      `}

      <div class="note">Wireframe note: placeholder shows immediately on tap; render swaps in once ready — rooms load independently, so picking 3 rooms doesn't block on the slowest one.</div>
    `;
  }

  if(state.step === 9){
    const totalDays = Math.max(...timelineTasks.map(t => t.end));
    const totalWeeks = Math.ceil(totalDays / 7);
    const handoverTask = timelineTasks.find(t => t.cat === 'handover') || timelineTasks[timelineTasks.length-1];
    let completionStr = '', handoverStr = '';
    if(d.startDate){
      const start = new Date(d.startDate + 'T00:00:00');
      const end = new Date(start);
      end.setDate(start.getDate() + totalDays - 1);
      completionStr = end.toLocaleDateString('en-SG', { day:'numeric', month:'short', year:'numeric' });
      const handover = new Date(start);
      handover.setDate(start.getDate() + handoverTask.start - 1);
      handoverStr = handover.toLocaleDateString('en-SG', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    }
    html = `
      <div class="eyebrow">Project timeline</div>
      <h1>Trade-by-trade schedule</h1>
      <p class="sub">~${totalWeeks} weeks (${totalDays} working days), modeled on a real BTO 4-room semi-open-kitchen job. Adjusts to your flat's scope once contractor-confirmed.</p>

      <label class="field-label">Estimated start date</label>
      <div class="date-row">
        <input class="text-input" type="date" value="${d.startDate}" oninput="state.data.startDate=this.value; render();" style="margin-bottom:0;">
      </div>
      ${d.startDate ? `
        <div class="date-summary">
          <div><span class="date-summary-label">Start</span>${new Date(d.startDate + 'T00:00:00').toLocaleDateString('en-SG', { day:'numeric', month:'short', year:'numeric' })}</div>
          <div class="date-summary-arrow">→</div>
          <div><span class="date-summary-label">Last trade work</span>${completionStr}</div>
        </div>
        <div class="handover-card">
          <div class="cap">ESTIMATED DATE OF HANDOVER</div>
          <div class="amt">${handoverStr}</div>
          <div class="cap">Keys and completed unit handed to you</div>
        </div>
      ` : `<div class="note" style="margin-top:14px;">Pick a start date to see your estimated handover date and calendar-mapped phases.</div>`}

      <div class="legend-row" style="margin-top:18px;">
        ${Object.entries({prep:'Prep & site',measure:'Measure',install:'Install',finish:'Finish',handover:'Handover'}).map(([k,label]) => `
          <div class="legend-item"><span class="legend-dot" style="background:${CAT_COLOR[k]}"></span>${label}</div>
        `).join('')}
      </div>

      <div class="gantt-list">
        ${timelineTasks.map(t => {
          const left = ((t.start-1)/totalDays*100).toFixed(1);
          const width = Math.max((((t.end-t.start+1))/totalDays*100), 1.6).toFixed(1);
          let dayLabel = `D${t.start}${t.end>t.start ? '–'+t.end : ''}`;
          if(d.startDate){
            const s = new Date(d.startDate + 'T00:00:00');
            const taskStart = new Date(s); taskStart.setDate(s.getDate() + t.start - 1);
            dayLabel = taskStart.toLocaleDateString('en-SG', { day:'numeric', month:'short' });
          }
          return `
          <div class="gantt-row">
            <div class="gantt-name">${t.name}</div>
            <div class="gantt-track">
              <div class="gantt-bar" style="left:${left}%; width:${width}%; background:${CAT_COLOR[t.cat]};"></div>
            </div>
            <div class="gantt-day">${dayLabel}</div>
          </div>`;
        }).join('')}
      </div>

      <div class="note">Wireframe note: task list, sequencing, and durations pulled directly from your uploaded schedule template. Real version lets this scale/re-order based on the scope from earlier screens (e.g. no kitchen hacking → shorter masonry phase).</div>
    `;
  }



  if(state.step === 11){
    html = `
      <div class="contact-page">
        <div class="contact-intro">
          <div class="eyebrow">GET IN TOUCH</div>
          <h1>Let's create<br>your home.</h1>
          <p class="sub">Tell us a little about your project and we'll be in touch to discuss the next step.</p>
        </div>

        <div class="contact-form-card">
          <div class="contact-card-label">CONTACT DETAILS</div>

          <div class="contact-form">
            <label>
              <span>Name</span>
              <input id="contactName" class="text-input" type="text" placeholder="Your name" autocomplete="name">
            </label>

            <label>
              <span>Email</span>
              <input id="contactEmail" class="text-input" type="email" placeholder="you@example.com" autocomplete="email">
            </label>

            <label>
              <span>Phone</span>
              <input id="contactPhone" class="text-input" type="tel" placeholder="+65 ..." autocomplete="tel">
            </label>

            <label>
              <span>Tell us about your project</span>
              <textarea id="contactMessage" class="textarea-input" rows="5" placeholder="BTO, Resale HDB or Condo?&#10;Tell us what you have in mind."></textarea>
            </label>

            <button class="btn btn-primary" onclick="submitContactForm()">Get in touch</button>
          </div>
        </div>

        <div class="contact-email-card">
          <div class="contact-card-label">EMAIL</div>
          <a href="mailto:fredwongstudio@gmail.com">fredwongstudio@gmail.com</a>
          <p>Prefer email? Send your project details directly and we'll get back to you.</p>
        </div>
      </div>
    `;
  }

  if(state.step === 10){
    const selectedTheme = themes.find(t=>t.name===d.theme) || themes[0];
    const totalDays = Math.max(...timelineTasks.map(t => t.end));
    const handoverTask = timelineTasks.find(t => t.cat === 'handover') || timelineTasks[timelineTasks.length-1];
    let handoverStr = 'Not yet set';
    if(d.startDate){
      const start = new Date(d.startDate + 'T00:00:00');
      const handover = new Date(start);
      handover.setDate(start.getDate() + handoverTask.start - 1);
      handoverStr = handover.toLocaleDateString('en-SG', { day:'numeric', month:'short', year:'numeric' });
    }
    html = `
      <div class="final-page">
      <div class="eyebrow">Thank you</div>
      <h1>You've designed the start of your dream home</h1>
      <p class="sub">Here's everything you put together. Ready to bring it to life? The fredwongstudio team can take it from here.</p>

      <div class="final-summary-grid">
        <div class="final-summary-item"><span class="summary-label">Unit</span><strong>${d.unitType ? `${d.unitType} (${d.flatSource || 'BTO'})` : '—'}</strong></div>
        <div class="final-summary-item"><span class="summary-label">Theme</span><strong>${d.theme || '—'}</strong></div>
        <div class="final-summary-item"><span class="summary-label">Budget</span><strong>${d.budget || '—'}</strong></div>
        <div class="final-summary-item"><span class="summary-label">Handover</span><strong>${handoverStr}</strong></div>
      </div>

      <div class="result-section-label">Floor plan</div>
      <div class="result-plan" style="margin-bottom:18px;">
        <svg viewBox="0 0 ${REAL_PLAN_W} ${REAL_PLAN_H}" width="100%" style="display:block;">
          ${renderFurnishedFloorPlan(selectedTheme.colors)}
        </svg>
      </div>

      <div class="result-section-label">Moodboard</div>
      <div class="palette-row">
        ${selectedTheme.colors.map(c => `<div class="palette-sw" style="background:${c}; height:32px;"></div>`).join('')}
      </div>

      <div class="result-section-label">3D room views</div>
      ${d.renderRooms.length === 0 ? `
        <div class="note" style="margin-bottom:18px;">No rooms were rendered in this session.</div>
      ` : `
        <div class="render-grid" style="margin-bottom:18px;">
          ${d.renderRooms.map(r => {
            const ready = d.renderStatus[r] === 'ready';
            return `
            <div class="render-card">
              <div class="render-box ${ready ? 'ready' : 'pending'}" style="${ready ? `background:linear-gradient(135deg, ${selectedTheme.colors[0]}, ${selectedTheme.colors[1]})` : ''}">
                ${ready ? `<span class="render-tag">${r}</span>` : `<span class="render-status-label">Not ready</span>`}
              </div>
              <div class="render-caption">${r}</div>
            </div>`;
          }).join('')}
        </div>
      `}

      <div class="result-section-label">Cost & timeline</div>
      <div class="cost-card" style="margin-bottom:12px;">
        <div class="cap">ESTIMATED PROJECT COST</div>
        <div class="amt">${d.budget || 'SGD 40,000 – 60,000'}</div>
      </div>
      <div class="handover-card" style="margin-bottom:22px;">
        <div class="cap">ESTIMATED DATE OF HANDOVER</div>
        <div class="amt" style="font-size:15px;">${handoverStr}</div>
      </div>

      <button class="btn btn-primary" style="width:100%; margin-bottom:10px; padding:14px;" onclick="setStep(11)">Get in touch</button>
      <button class="btn btn-secondary" style="width:100%; flex:none;" onclick="alert('Wireframe note: this would take the user to a persistent My Projects dashboard, outside the copilot.')">
        Go to my projects
      </button>

      <div class="note" style="margin-top:16px;">Wireframe note: no PDF export — keeping the project viewable only in-app (and shareable via contact/consultation) encourages users to return rather than take a file and leave.</div>
      </div>
    `;
  }

  el.innerHTML = html;
  if(state.step === 3 && d.calibPoints.length === 2){
    setupCalibDrag();
  }
}

// 5. It then optionally calls an image-generation model using brief.visualPrompt.
// 6. Return { brief, imageUrl }.
// Keep all private API keys server-side.

render();
</script>

  function syncResponsiveMode() {
    document.documentElement.dataset.viewport =
      window.innerWidth <= 640 ? "mobile" :
      window.innerWidth <= 900 ? "tablet" : "desktop";
  }
  syncResponsiveMode();
  window.addEventListener("resize", syncResponsiveMode, {passive:true});
  window.addEventListener("orientationchange", syncResponsiveMode, {passive:true});
