<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="description" content="IDCopilot — your AI Interior Design Copilot for turning your home, lifestyle and design preferences into a personalised interior concept.">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IDCopilot — AI Interior Design Copilot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root{
    --ink:#17202a;
    --paper:#f4f5f7;
    --blueprint:#111827;
    --blueprint-light:#2b3440;
    --line:#e0e4e8;
    --amber:#111827;
    --amber-dark:#111827;
    --ok:#087f5b;
    --card:#ffffff;
    --muted:#68737d;
    --radius:12px;
    --soft:#fafbfc;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:18px 12px;
  }

  .device{
    width:100%;
    max-width:420px;
    background:var(--card);
    border-radius:14px;
    border:1px solid #e0e4e8;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-height:760px;
  }

  /* Header / ruler progress */
  .topbar{
    background:var(--blueprint);
    color:#fff;
    padding:18px 20px 22px;
  }
  .brand{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
  }
  .brand-name{
    font-weight:700; font-size:15px; letter-spacing:0.02em;
  }
  .brand-name .dot{ color:var(--amber); }
  .step-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:#B9C7D6;
    letter-spacing:0.03em;
  }
  .ruler{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:22px;
  }
  .tick{
    flex:1;
    background:rgba(255,255,255,0.22);
    height:8px;
    border-radius:2px;
    position:relative;
    transition:all .25s ease;
  }
  .tick.done{ background:var(--amber); height:14px; }
  .tick.active{ background:#fff; height:22px; }
  .tick-num{
    position:absolute;
    top:-16px;
    left:50%;
    transform:translateX(-50%);
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    color:#B9C7D6;
    display:none;
  }
  .tick.active .tick-num{ display:block; color:#fff; }

  /* Content */
  .screen{
    padding:28px 22px 22px;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--amber-dark);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:8px;
  }
  h1{
    font-size:22px;
    margin:0 0 8px;
    line-height:1.25;
  }
  .sub{
    color:var(--muted);
    font-size:13.5px;
    line-height:1.5;
    margin:0 0 22px;
  }

  .field-label{
    font-size:12px;
    font-weight:600;
    color:var(--ink);
    margin:0 0 8px;
    display:block;
  }
  .chip-row{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;
  }
  .chip{
    padding:9px 14px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:#fff;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
    color:var(--ink);
    transition:all .15s ease;
  }
  .chip:hover{ border-color:var(--blueprint-light); }
  .chip.selected{
    background:var(--blueprint);
    border-color:var(--blueprint);
    color:#fff;
  }

  .upload-box{
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    padding:28px 16px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    cursor:pointer;
    margin-bottom:20px;
    transition:all .15s ease;
  }
  .upload-box:hover{ border-color:var(--amber); color:var(--amber-dark); }
  .upload-box.filled{
    border-style:solid;
    border-color:var(--ok);
    color:var(--ok);
    background:#f2f8f5;
  }
  .upload-box svg{ margin-bottom:8px; }

  /* Floor plan calibration mock */
  .plan-wrap{
    position:relative;
    border-radius:var(--radius);
    border:1.5px solid var(--line);
    background:#fff;
    margin-bottom:14px;
    overflow:hidden;
  }
  .plan-hint{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    padding:8px 12px;
    background:var(--soft);
    border-bottom:1px solid var(--line);
  }
  .room-dot{
    position:absolute;
    width:26px; height:26px;
    border-radius:50%;
    background:var(--amber);
    border:2px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:center;
    font-size:8.5px; color:#fff; font-weight:700;
    cursor:pointer;
  }
  .calib-input-row{
    display:flex; gap:8px; margin-bottom:20px;
  }
  .calib-input-row input{
    flex:1;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
  }

  .stepper-row{
    display:flex; align-items:center; gap:14px; margin-bottom:20px;
  }
  .stepper-btn{
    width:36px; height:36px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    font-size:16px;
    cursor:pointer;
    color:var(--blueprint);
  }
  .stepper-val{
    font-family:'JetBrains Mono', monospace;
    font-size:16px;
    min-width:24px;
    text-align:center;
  }

  .toggle-row{
    display:flex; gap:8px; margin-bottom:18px;
  }
  .toggle-row .chip{ flex:1; text-align:center; }

  .member-row{
    padding-bottom:2px;
  }
  .member-row-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:8px;
  }

  .conditional-block{
    background:var(--soft);
    border:1px solid var(--line);
    border-left:3px solid var(--amber);
    border-radius:10px;
    padding:14px 14px 4px;
    margin:-4px 0 20px;
  }
  .text-input{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-family:inherit;
    font-size:13px;
    margin-bottom:14px;
    background:#fff;
  }
  .textarea-input{
    min-height:70px;
    resize:vertical;
    line-height:1.4;
  }

  .q-block{ margin-bottom:4px; }

  .inspo-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    margin-top:10px;
    margin-bottom:20px;
  }
  .inspo-thumb{
    position:relative;
    aspect-ratio:1/1;
    border-radius:10px;
    background:linear-gradient(135deg, #E8E4DB, #C9D3DC);
    border:1.5px solid var(--line);
    display:flex;
    align-items:flex-end;
    padding:6px;
  }
  .inspo-name{
    font-size:9px;
    color:var(--ink);
    background:rgba(255,255,255,0.75);
    padding:2px 5px;
    border-radius:4px;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .inspo-remove{
    position:absolute;
    top:5px; right:5px;
    width:18px; height:18px;
    border-radius:50%;
    background:rgba(22,35,58,0.7);
    color:#fff;
    font-size:12px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  .style-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:16px;
  }
  .style-photo-card{ cursor:pointer; }
  .style-photo{
    position:relative;
    aspect-ratio:3/4;
    border-radius:12px;
    overflow:hidden;
    border:2px solid transparent;
    display:flex;
    align-items:flex-end;
    transition:all .15s ease;
  }
  .style-photo-card.selected .style-photo{
    border-color:var(--amber);
    box-shadow:0 4px 14px -4px rgba(201,134,47,0.5);
  }
  .style-check{
    position:absolute;
    top:8px; right:8px;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--amber);
    color:#fff;
    font-size:12px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .style-caption{
    width:100%;
    padding:10px 10px 9px;
    background:linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
  }
  .style-name{ color:#fff; font-size:12.5px; font-weight:700; }
  .style-desc{ color:rgba(255,255,255,0.85); font-size:10px; margin-top:1px; }

  .budget-card, .theme-card{
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .budget-card.selected, .theme-card.selected{
    border-color:var(--lavender);
    background:var(--lavender-soft);
  }
  .budget-card .amt{ font-family:'JetBrains Mono', monospace; font-weight:600; font-size:14px; }
  .budget-card .desc{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  .theme-card{ display:flex; align-items:center; gap:12px; }
  .swatch-set{ display:flex; gap:3px; }
  .swatch{ width:14px; height:14px; border-radius:3px; }
  .theme-name{ font-weight:600; font-size:13.5px; }
  .theme-desc{ font-size:11.5px; color:var(--muted); }

  /* Generating */
  .gen-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .spinner{
    width:56px; height:56px;
    border-radius:50%;
    border:4px solid var(--line);
    border-top-color:var(--amber);
    animation:spin 1s linear infinite;
    margin-bottom:20px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .gen-status{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    margin-top:6px;
  }

  /* Results */
  .result-plan{
    border-radius:var(--radius);
    border:1.5px solid var(--line);
    background:#fff;
    padding:0;
    margin-bottom:16px;
    overflow:hidden;
  }
  .result-section-label{
    font-size:11px;
    font-family:'JetBrains Mono', monospace;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    margin:0 0 10px;
  }
  .palette-row{ display:flex; gap:8px; margin-bottom:18px; }
  .palette-sw{
    flex:1; height:44px; border-radius:8px;
  }
  .cost-card{
    background:var(--blueprint);
    color:#fff;
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:18px;
  }
  .cost-card .amt{
    font-family:'JetBrains Mono', monospace;
    font-size:24px;
    font-weight:600;
    margin:4px 0 2px;
  }
  .cost-card .cap{ font-size:11px; color:#B9C7D6; }

  /* Footer nav */
  .summary-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
  }
  .summary-item{
    background:var(--soft);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:13px;
    font-weight:600;
  }
  .summary-label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-weight:400;
    margin-bottom:3px;
  }

  .footer{
    padding:16px 22px 22px;
    display:flex;
    gap:10px;
    border-top:1px solid var(--line);
  }
  .btn{
    flex:1;
    padding:13px 16px;
    border-radius:12px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    border:none;
  }
  .btn-primary{ background:var(--amber); color:#fff; }
  .btn-primary:hover{ background:var(--amber-dark); }
  .btn-secondary{ background:#fff; color:var(--ink); border:1.5px solid var(--line); flex:0 0 90px; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .date-row{ margin-bottom:14px; }
  .date-summary{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--soft);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    margin-bottom:4px;
  }
  .date-summary-arrow{ color:var(--muted); }
  .date-summary-label{
    display:block;
    font-size:9.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:2px;
  }
  .handover-card{
    background:var(--blueprint);
    color:#fff;
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:4px;
  }
  .handover-card .amt{
    font-family:'JetBrains Mono', monospace;
    font-size:17px;
    font-weight:600;
    margin:4px 0 2px;
  }
  .handover-card .cap{ font-size:11px; color:#B9C7D6; }

  .legend-row{
    display:flex; flex-wrap:wrap; gap:10px 14px;
    margin-bottom:16px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .legend-item{
    display:flex; align-items:center; gap:5px;
    font-size:10.5px; color:var(--muted);
    font-family:'JetBrains Mono', monospace;
  }
  .legend-dot{ width:8px; height:8px; border-radius:2px; display:inline-block; }

  .gantt-list{ margin-bottom:6px; }
  .gantt-row{
    display:grid;
    grid-template-columns:98px 1fr 44px;
    align-items:center;
    gap:8px;
    margin-bottom:9px;
  }
  .gantt-name{
    font-size:11.5px;
    font-weight:600;
    line-height:1.25;
  }
  .gantt-track{
    position:relative;
    height:10px;
    background:#EEECE6;
    border-radius:4px;
    overflow:hidden;
  }
  .gantt-bar{
    position:absolute;
    top:0; bottom:0;
    border-radius:4px;
  }
  .gantt-day{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    color:var(--muted);
    text-align:right;
  }

  .render-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:16px;
  }
  .render-card{ display:flex; flex-direction:column; gap:6px; }
  .render-box{
    aspect-ratio:4/3;
    border-radius:12px;
    border:1.5px solid var(--line);
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:flex-end;
    justify-content:flex-start;
  }
  .render-box.pending{
    background:#EEECE6;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:8px;
  }
  .shimmer{
    width:60%; height:8px;
    border-radius:4px;
    background:linear-gradient(90deg, #DEDCD4 25%, #F3F1EA 37%, #DEDCD4 63%);
    background-size:400% 100%;
    animation:shimmer 1.4s ease infinite;
  }
  @keyframes shimmer{
    0%{ background-position:100% 50%; }
    100%{ background-position:0 50%; }
  }
  .render-status-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--muted);
  }
  .render-tag{
    background:rgba(22,35,58,0.55);
    color:#fff;
    font-size:10px;
    font-family:'JetBrains Mono', monospace;
    padding:4px 8px;
    border-radius:6px;
    margin:8px;
  }
  .render-caption{
    font-size:11.5px;
    font-weight:600;
    color:var(--ink);
  }

  .dim-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    font-weight:700;
    color:var(--ok);
    text-align:center;
  }
  .dim-label-top{ margin-bottom:4px; }
  .dim-label-left{
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    display:flex;
    align-items:center;
    padding-right:6px;
  }

  .brief-accordion{ margin-bottom:6px; }
  .brief-item{
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:8px;
    overflow:hidden;
  }
  .brief-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    cursor:pointer;
    background:var(--soft);
  }
  .brief-header-label{ font-size:13.5px; font-weight:600; }
  .brief-header-chevron{
    font-family:'JetBrains Mono', monospace;
    font-size:16px;
    color:var(--amber-dark);
    font-weight:700;
  }
  .brief-body{ padding:14px; border-top:1px solid var(--line); }

  .detect-list{ margin-bottom:16px; }
  .detect-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .detect-text-block{ flex:1; }
  .detect-ocr{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--muted);
    margin-bottom:4px;
  }
  .detect-select{
    width:100%;
    padding:8px 10px;
    border-radius:8px;
    border:1.5px solid var(--line);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    background:#fff;
  }
  .detect-conf{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    font-weight:700;
    padding:4px 8px;
    border-radius:6px;
    flex:0 0 auto;
  }
  .detect-conf.high{ background:#E9F3EC; color:var(--ok); }
  .detect-conf.mid{ background:#FBF3E7; color:var(--amber-dark); }
  .detect-conf.low{ background:#FBEAE7; color:#B44B3B; }

  .note{
    font-size:11.5px;
    color:var(--muted);
    background:var(--soft);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-top:2px;
    margin-bottom:18px;
  }

/* =========================================================
   Responsive Web App Layer
   Mobile-first, tablet and desktop
   ========================================================= */

* { box-sizing: border-box; }

html {
  width: 100%;
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  width: 100%;
  min-width: 320px;
  overflow-x: hidden;
}

button, input, textarea, select {
  max-width: 100%;
  font: inherit;
}

img, svg {
  max-width: 100%;
}

.app {
  width: 100%;
  min-height: 100vh;
}

.shell {
  width: min(100%, 1180px);
  margin: 0 auto;
  padding-left: clamp(16px, 3vw, 32px);
  padding-right: clamp(16px, 3vw, 32px);
}

.main,
.content,
.page,
.panel {
  min-width: 0;
}

.stepper,
.progress,
.nav,
.topbar {
  max-width: 100%;
}

/* Cards and grids should never force horizontal scrolling */
.style-grid,
.inspo-grid,
.render-grid,
.summary-row,
.palette-row,
.chip-row,
.option-grid,
.card-grid,
.brief-accordion {
  width: 100%;
  min-width: 0;
}

.style-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr));
  gap: 12px;
}

.render-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
  gap: 12px;
}

.inspo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 10px;
}

.summary-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.summary-item {
  min-width: 0;
  overflow-wrap: anywhere;
}

.result-plan,
.result-card,
.cost-card,
.handover-card,
.note,
.brief-item,
.render-card {
  min-width: 0;
  max-width: 100%;
}

.result-plan svg {
  width: 100%;
  height: auto;
}

textarea {
  width: 100%;
  resize: vertical;
}

.text-input {
  width: 100%;
  min-width: 0;
}

.btn {
  min-height: 44px;
  touch-action: manipulation;
}

.chip {
  min-height: 42px;
  touch-action: manipulation;
}

.upload-box {
  min-height: 92px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 18px;
  cursor: pointer;
}

.style-photo-card {
  min-width: 0;
}

.style-photo {
  min-height: 210px;
}

.render-box {
  width: 100%;
  aspect-ratio: 4 / 3;

function renderFurnishedFloorPlan(themeColors){
  const [c0, c1, c2] = themeColors;
  const catFill = { bedroom: c0, living: c0, kitchen: '#DDD8CC', bath: '#E7ECEE', yard: '#EDEAE3', utility: '#F3F2ED' };
  const catOf = (ab) => {
    if(['B2','B3','MB'].includes(ab)) return 'bedroom';
    if(ab === 'LD') return 'living';
    if(ab === 'K') return 'kitchen';
    if(ab === 'W1' || ab === 'W2') return 'bath';
    if(ab === 'SY') return 'yard';
    return 'utility';
  };
  let svg = '';

  REAL_PLAN_ROOMS.forEach(r => {
    const cat = catOf(r.abbrev);
    svg += `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${catFill[cat]}" stroke="#C9C3B6" stroke-width="24"/>`;

    if(cat === 'bedroom'){
      const bedW = Math.min(r.w * 0.6, r.abbrev==='MB' ? 1900 : 1500);
      const bedH = Math.min(r.h * 0.5, r.abbrev==='MB' ? 2400 : 1900);
      const bx = r.x + 150, by = r.y + 130;
      svg += `<rect x="${bx}" y="${by}" width="${bedW}" height="${bedH}" rx="30" fill="#fff" stroke="${c2}" stroke-width="16"/>`;
      svg += `<rect x="${bx}" y="${by}" width="${bedW}" height="${bedH*0.14}" rx="20" fill="${c1}" stroke="${c2}" stroke-width="10"/>`;
      svg += `<ellipse cx="${bx+bedW*0.28}" cy="${by+bedH*0.16}" rx="${bedW*0.2}" ry="${bedH*0.09}" fill="#fff" stroke="${c2}" stroke-width="8"/>`;
      svg += `<ellipse cx="${bx+bedW*0.72}" cy="${by+bedH*0.16}" rx="${bedW*0.2}" ry="${bedH*0.09}" fill="#fff" stroke="${c2}" stroke-width="8"/>`;
      if(r.abbrev==='MB'){
        svg += `<path d="M ${bx+50} ${by+bedH*0.62} q ${bedW/2-50} ${bedH*0.14} ${bedW-100} 0" fill="none" stroke="${c2}" stroke-width="8"/>`;
      }
      const wardW = 450, wardH = Math.min(r.h*0.55, 1500);
      const wx = r.x + r.w - wardW - 100, wy = r.y + r.h - wardH - 100;
      svg += `<rect x="${wx}" y="${wy}" width="${wardW}" height="${wardH}" fill="#EDE6D8" stroke="${c2}" stroke-width="14"/>`;
      svg += `<line x1="${wx+wardW/2}" y1="${wy}" x2="${wx+wardW/2}" y2="${wy+wardH}" stroke="${c2}" stroke-width="6"/>`;
      svg += `<circle cx="${wx+wardW*0.42}" cy="${wy+wardH/2}" r="16" fill="${c2}"/>`;
      svg += `<circle cx="${wx+wardW*0.58}" cy="${wy+wardH/2}" r="16" fill="${c2}"/>`;
    }

    if(cat === 'living'){
      svg += `<rect x="${r.x+120}" y="${r.y+150}" width="620" height="1850" rx="50" fill="${c1}" stroke="${c2}" stroke-width="16"/>`;
      svg += `<rect x="${r.x+120}" y="${r.y+150}" width="620" height="240" rx="35" fill="${c2}" opacity="0.35" stroke="${c2}" stroke-width="8"/>`;
      [0,1,2].forEach(i => {
        svg += `<rect x="${r.x+180}" y="${r.y+430+i*570}" width="500" height="480" rx="24" fill="#fff" stroke="${c2}" stroke-width="8" opacity="0.85"/>`;
      });
      svg += `<rect x="${r.x+950}" y="${r.y+650}" width="480" height="650" rx="30" fill="#fff" stroke="${c2}" stroke-width="14"/>`;
      svg += `<rect x="${r.x+1300}" y="${r.y+150}" width="1750" height="220" rx="16" fill="#DCD5C6" stroke="#8A8477" stroke-width="10"/>`;
      const dtY = r.y + r.h - 1550;
      svg += `<rect x="${r.x+400}" y="${dtY}" width="1350" height="900" rx="28" fill="#fff" stroke="${c2}" stroke-width="16"/>`;
      [0,1,2,3].forEach(i => {
        const cx = r.x + 500 + (i%2) * 1080;
        const cy = dtY - 80 + Math.floor(i/2) * 980;
        svg += `<rect x="${cx}" y="${cy}" width="210" height="210" rx="40" fill="${c1}" stroke="${c2}" stroke-width="10"/>`;
      });
    }

    if(cat === 'kitchen'){
      svg += `<rect x="${r.x+50}" y="${r.y+50}" width="${r.w-100}" height="480" fill="#DDD8CC" stroke="#8A8477" stroke-width="16"/>`;
      svg += `<rect x="${r.x+50}" y="${r.y+530}" width="480" height="${Math.max(r.h-580,200)}" fill="#DDD8CC" stroke="#8A8477" stroke-width="16"/>`;
      svg += `<g stroke="#5B564B" stroke-width="12" fill="none">
        <circle cx="${r.x+650}" cy="${r.y+240}" r="110"/><circle cx="${r.x+650}" cy="${r.y+240}" r="46"/>
        <circle cx="${r.x+1000}" cy="${r.y+240}" r="110"/><circle cx="${r.x+1000}" cy="${r.y+240}" r="46"/>
      </g>`;
      svg += `<rect x="${r.x+1750}" y="${r.y+140}" width="620" height="330" rx="30" fill="#F4F2EC" stroke="#5B564B" stroke-width="14"/>`;
      svg += `<ellipse cx="${r.x+1930}" cy="${r.y+305}" rx="140" ry="100" fill="#DCE3E6" stroke="#5B564B" stroke-width="8"/>`;
      svg += `<ellipse cx="${r.x+2280}" cy="${r.y+305}" rx="140" ry="100" fill="#DCE3E6" stroke="#5B564B" stroke-width="8"/>`;
      svg += `<rect x="${r.x+r.w-680}" y="${r.y+80}" width="580" height="420" rx="20" fill="#EDEAE3" stroke="#8A8477" stroke-width="14"/>`;
      svg += `<line x1="${r.x+r.w-680}" y1="${r.y+280}" x2="${r.x+r.w-100}" y2="${r.y+280}" stroke="#8A8477" stroke-width="8"/>`;
    }

    if(cat === 'bath'){
      const cx = r.x + r.w - 380, cy = r.y + r.h - 400;
      svg += `<path d="M ${cx} ${cy-350} a 250 350 0 1 0 0.1 0 Z" fill="#F4F2EC" stroke="#5B564B" stroke-width="14"/>`;
      svg += `<rect x="${cx-220}" y="${cy-780}" width="530" height="200" rx="20" fill="#F4F2EC" stroke="#5B564B" stroke-width="12"/>`;
      svg += `<rect x="${r.x+140}" y="${r.y+140}" width="380" height="240" rx="30" fill="#F4F2EC" stroke="#5B564B" stroke-width="14"/>`;
      svg += `<ellipse cx="${r.x+330}" cy="${r.y+265}" rx="145" ry="95" fill="#DCE3E6" stroke="#5B564B" stroke-width="8"/>`;
    }

    if(cat === 'yard'){
      const cx = r.x + 460, cy = r.y + 460;
      svg += `<rect x="${r.x+150}" y="${r.y+150}" width="620" height="620" rx="24" fill="#F4F2EC" stroke="#5B564B" stroke-width="16"/>`;
      svg += `<circle cx="${cx}" cy="${cy+40}" r="230" fill="none" stroke="#5B564B" stroke-width="14"/>`;
      svg += `<circle cx="${cx}" cy="${cy+40}" r="145" fill="none" stroke="#5B564B" stroke-width="10"/>`;
      svg += `<rect x="${r.x+150}" y="${r.y+150}" width="620" height="110" fill="#DCD5C6" stroke="#5B564B" stroke-width="8"/>`;
    }

    if(cat === 'utility'){
      if(r.abbrev === 'HS'){
        svg += `<rect x="${r.x+195}" y="${r.y+200}" width="${r.w-390}" height="180" fill="none" stroke="#B0AA9C" stroke-width="10"/>`;
        svg += `<rect x="${r.x+195}" y="${r.y+500}" width="${r.w-390}" height="180" fill="none" stroke="#B0AA9C" stroke-width="10"/>`;
      } else {
        svg += `<rect x="${r.x+150}" y="${r.y+180}" width="${r.w-300}" height="380" fill="none" stroke="#B0AA9C" stroke-width="10" stroke-dasharray="40,30"/>`;
      }
    }
  });

  svg += `<polygon points="${REAL_PLAN_OUTLINE}" fill="none" stroke="#16233A" stroke-width="90"/>`;

  REAL_PLAN_ROOMS.forEach(r => {
    const lines = r.label.toUpperCase().split(' ');
    const singleLine = r.label.length <= 8 || r.w > 2600;
    if(r.abbrev === 'LD'){
      svg += `<text x="${r.x+180}" y="${r.y+2950}" font-size="220" fill="#2B2621" font-family="sans-serif" font-weight="700">LIVING / DINING</text>`;
    } else if(singleLine){
      svg += `<text x="${r.x+r.w/2}" y="${r.y+220}" font-size="220" text-anchor="middle" fill="#2B2621" font-family="sans-serif" font-weight="700">${r.label.toUpperCase()}</text>`;
    } else {
      svg += `<text x="${r.x+120}" y="${r.y+r.h-380}" font-size="185" fill="#2B2621" font-family="sans-serif" font-weight="700">
        <tspan x="${r.x+120}" dy="0">${lines[0]}${lines.length>1?'':''}</tspan>
        ${lines.slice(1).map(l => `<tspan x="${r.x+120}" dy="215">${l}</tspan>`).join('')}
      </text>`;
    }
  });

  return svg;
}

function toggleDeepBriefSection(key){
  state.data.deepBriefOpen[key] = !state.data.deepBriefOpen[key];
  render();
}

function updateDeepBrief(key, field, value){
  if(!state.data.deepBrief[key]) state.data.deepBrief[key] = {};
  state.data.deepBrief[key][field] = value;
}

function toggleChip(field, value){
  state.data[field] = state.data[field] === value ? null : value;
  render();
}

function syncHouseholdMembers(){
  const n = state.data.household;
  const arr = state.data.householdMembers;
  while(arr.length < n) arr.push({ gender: null, age: '' });
  while(arr.length > n) arr.pop();
}

function setHouseholdSize(n){
  state.data.household = Math.max(1, n);
  syncHouseholdMembers();
  render();
}

function setMemberField(idx, field, value){
  state.data.householdMembers[idx][field] = value;
}

function toggleMemberGender(idx, value){
  const m = state.data.householdMembers[idx];
  m.gender = m.gender === value ? null : value;
  render();
}

function handleFloorPlanUpload(event){
  const file = event.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(e){
    state.data.floorPlanImage = e.target.result;
    state.data.floorPlanFileName = file.name;
    state.data.fileUploaded = true;
    state.data.calibPoints = [];
    state.data.calibLength = '';
    state.data.calibConfirmed = false;
    state.data.calibAutoAttempted = false;
    render();
  };
  reader.readAsDataURL(file);
}
function removeFloorPlan(event){
  if(event) event.stopPropagation();
  state.data.floorPlanImage = null;
  state.data.floorPlanFileName = '';
  state.data.fileUploaded = false;
  state.data.floorPlanAnalysis = null;
  state.data.floorPlanAiStatus = 'idle';
  state.data.floorPlanAiError = null;
  state.data.floorPlanUnderstandingConfirmed = false;
  state.data.calibAutoAttempted = false;
  state.data.calibPoints = [];
  state.data.calibLength = '';
  state.data.calibConfirmed = false;
  const input = document.getElementById('floorplan-file-input');
  if(input) input.value = '';
  render();
}

function setupCalibDrag(){
  const surface = document.getElementById('calib-surface');
  const line = document.getElementById('calib-line');
  if(!surface) return;

  // Existing endpoints can be dragged after the line has been created.
  document.querySelectorAll('.calib-point').forEach(circle => {
    circle.addEventListener('pointerdown', function(e){
      e.preventDefault();
      e.stopPropagation();
      const idx = parseInt(circle.getAttribute('data-idx'), 10);
      const rect = surface.getBoundingClientRect();
      circle.setPointerCapture?.(e.pointerId);

      function toPct(evt){
        return {
          x: Math.max(0, Math.min(100, ((evt.clientX - rect.left) / rect.width) * 100)),
          y: Math.max(0, Math.min(100, ((evt.clientY - rect.top) / rect.height) * 100))
        };
      }

      function onMove(ev){
        const p = toPct(ev);
        circle.setAttribute('cx', p.x);
        circle.setAttribute('cy', p.y);
        if(line){
          if(idx === 0){ line.setAttribute('x1', p.x); line.setAttribute('y1', p.y); }
          else { line.setAttribute('x2', p.x); line.setAttribute('y2', p.y); }
        }
        state.data.calibPoints[idx] = p;
        state.data.calibConfirmed = false;
      }

      function onUp(){
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        render();
      }

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });

  // If a line already exists, allow dragging the line itself to move the
  // whole reference measurement without changing its length.
  if(line){
    line.style.pointerEvents = 'stroke';
    line.style.cursor = 'grab';
    line.addEventListener('pointerdown', function(e){
      e.preventDefault();
      e.stopPropagation();
      const rect = surface.getBoundingClientRect();
      const p0 = state.data.calibPoints[0];
      const p1 = state.data.calibPoints[1];
      const startX = e.clientX;
      const startY = e.clientY;
      const original = [{...p0},{...p1}];

      function onMove(ev){
        const dx = ((ev.clientX - startX) / rect.width) * 100;
        const dy = ((ev.clientY - startY) / rect.height) * 100;
        const nx0 = Math.max(0, Math.min(100, original[0].x + dx));
        const ny0 = Math.max(0, Math.min(100, original[0].y + dy));
        const nx1 = Math.max(0, Math.min(100, original[1].x + dx));
        const ny1 = Math.max(0, Math.min(100, original[1].y + dy));
        state.data.calibPoints = [{x:nx0,y:ny0},{x:nx1,y:ny1}];
        render();
      }

      function onUp(){
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  }
}

function handleCalibClick(e){
  const surface = e.currentTarget;
  const rect = surface.getBoundingClientRect();
  const start = {
    x: Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100)),
    y: Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100))
  };

  // First interaction starts the measurement line. Drag to the other end.
  state.data.calibPoints = [start, {...start}];
  state.data.calibLength = '';
  state.data.calibConfirmed = false;
  state.data.calibRect = { w: rect.width, h: rect.height };
  render();

  const liveSurface = document.getElementById('calib-surface');
  const liveRect = liveSurface.getBoundingClientRect();

  function toPct(evt){
    return {
      x: Math.max(0, Math.min(100, ((evt.clientX - liveRect.left) / liveRect.width) * 100)),
      y: Math.max(0, Math.min(100, ((evt.clientY - liveRect.top) / liveRect.height) * 100))
    };
  }

  function onMove(ev){
    const p = toPct(ev);
    state.data.calibPoints[1] = p;
    const line = document.getElementById('calib-line');
    if(line){
      line.setAttribute('x2', p.x);
      line.setAttribute('y2', p.y);
    }
    const second = document.querySelector('.calib-point[data-idx="1"]');
    if(second){
      second.setAttribute('cx', p.x);
      second.setAttribute('cy', p.y);
    }
  }

  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    if(state.data.calibPoints.length === 2) render();
  }

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function analyzeFloorPlan(){
  const d = state.data;
  if(!d.floorPlanImage){
    d.floorPlanAiError = 'Please upload a floor plan first.';
    render();
    return;
  }

  d.floorPlanAiStatus = 'loading';
  d.floorPlanAiError = null;
  render();

  // Production hook:
  // POST the image + current project data to /api/floor-plan-agent.
  // The server should return structured JSON:
  // {summary, property_type, unit_type, spaces, fixed_elements,
  //  opportunities, questions, confidence}
  fetch('/api/floor-plan-agent', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      floor_plan_data_url:d.floorPlanImage,
      project:{
        property_type:d.flatSource,
        unit_type:d.unitType
      }
    })
  })
  .then(r => {
    if(!r.ok) throw new Error('AI endpoint unavailable');
    return r.json();
  })
  .then(result => {
    d.floorPlanAnalysis = result;
    d.floorPlanAiStatus = 'ready';
    render();
  })
  .catch(() => {
    // Demo fallback keeps the HTML prototype usable before the backend is deployed.
    d.floorPlanAnalysis = {
      summary:`I can see this is a ${d.flatSource || 'residential'} floor plan. I’ll use the visible room arrangement as the spatial foundation for your design.`,
      property_type:d.flatSource || 'Not confirmed',
      unit_type:d.unitType || 'Not confirmed',
      spaces:['Living / dining area','Kitchen','Bedroom(s)','Bathroom(s)','Circulation / entry'],
      fixed_elements:['Existing external walls','Visible wet-area positions','Door and window locations where identifiable'],
      opportunities:['Review circulation before furniture placement','Look for integrated storage opportunities','Check kitchen workflow and service access'],
      questions:['Confirm any walls that cannot be altered','Confirm room labels where the plan is unclear'],
      confidence:'Prototype confidence: medium'
    };
    d.floorPlanAiStatus = 'demo';
    d.floorPlanAiError = 'Live AI is not connected yet — showing the prototype analysis.';
    render();
  });
}

function handleInspirationUpload(event){
  const files = Array.from(event.target.files || []);
  if(!files.length) return;

  const remaining = Math.max(0, 12 - (state.data.inspirationImages || []).length);
  files.slice(0, remaining).forEach(file => {
    if(!file.type.startsWith('image/')) return;

    const reader = new FileReader();
    reader.onload = e => {
      if(!state.data.inspirationImages) state.data.inspirationImages = [];
      state.data.inspirationImages.push({
        id: Date.now() + Math.random(),
        name: file.name,
        dataUrl: e.target.result
      });
      render();
    };
    reader.readAsDataURL(file);
  });

  event.target.value = '';
}

function setupFurnitureDrag(){
  document.querySelectorAll('.furniture-item').forEach(g => {
    g.addEventListener('pointerdown', function(e){
      e.preventDefault();
      const svg = g.closest('svg');
      const id = g.getAttribute('data-id');
      const piece = furniturePieces.find(p => p.id === id);
      const startPos = state.data.furniturePositions[id] || {x: piece.x, y: piece.y};

      function toSvgCoords(evt){
        const pt = svg.createSVGPoint();
        pt.x = evt.clientX; pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      const startSvg = toSvgCoords(e);
      const offsetX = startSvg.x - startPos.x;
      const offsetY = startSvg.y - startPos.y;
      g.style.cursor = 'grabbing';
      let liveX = startPos.x, liveY = startPos.y;

      function onMove(ev){
        const cur = toSvgCoords(ev);
        liveX = Math.max(PLAN_BOUNDS.minX, Math.min(PLAN_BOUNDS.maxX - piece.w, cur.x - offsetX));
        liveY = Math.max(PLAN_BOUNDS.minY, Math.min(PLAN_BOUNDS.maxY - piece.h, cur.y - offsetY));
        g.setAttribute('transform', `translate(${liveX - piece.x}, ${liveY - piece.y})`);
      }
      function onUp(){
        state.data.furniturePositions[id] = {x: liveX, y: liveY};
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        g.style.cursor = 'grab';
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });
}

function toggleRenderRoom(room){

    const delay = 1400 + Math.random()*1200;
    setTimeout(() => {
      if(state.data.renderStatus[room] === 'pending'){
        state.data.renderStatus[room] = 'ready';
        render();
      }
    }, delay);
  } else {
    state.data.renderRooms.splice(idx,1);
    delete state.data.renderStatus[room];
  }
  render();
}

  const t = themeMap[theme] || themeMap.Contemporary;
  const cooking = l.cookingFrequency || 'not specified';
  const storage = l.storageNeeds || 'not specified';
  const wfh = l.workingFromHome || 'not specified';

  return {
    conceptName:t.conceptName,
    designStory:`A ${t.mood.join(', ')} home designed around the household's lifestyle, with practical storage and comfortable family living while staying aligned with the selected ${theme} direction.`,
    mood:t.mood,
    colourPalette:t.palette.map(x=>({name:x[0],hex:x[1]})),
    materials:t.materials,
    designPrinciples:[
      `Prioritise ${storage.toLowerCase()} storage needs without visually cluttering the home.`,
      `Support ${cooking.toLowerCase()} cooking with a practical kitchen workflow.`,
      wfh === 'yes' || wfh === 'hybrid' ? 'Create a visually calm and practical work-from-home zone.' : 'Keep circulation and shared family areas comfortable and flexible.'
    ],
    rooms:{
      'Living/Dining':{
        purpose:'Comfortable family living and entertaining',
        keyFeatures:['integrated storage','comfortable seating','warm layered lighting'],
        materials:t.materials.slice(0,3)
      },
      'Kitchen':{
        purpose:'Efficient everyday cooking and storage',
        keyFeatures:['high-capacity storage','durable work surfaces','clear preparation zone'],
        materials:t.materials.slice(0,3)
      },
      'Main Bedroom':{
        purpose:'Calm private retreat',
        keyFeatures:['full-height wardrobe','soft lighting','quiet material palette'],
        materials:t.materials.slice(0,3)
      }
    },
    budgetStrategy:`Use the selected ${p.budget || 'budget range'} as the ceiling for specification decisions; prioritise the rooms and features the homeowner has explicitly marked as important.`,
    visualPrompt:`Photorealistic interior design for a Singapore ${p.unitType || 'home'} in a ${theme} direction. ${t.mood.join(', ')} atmosphere. Use ${t.materials.join(', ')}. Colour palette: ${t.palette.map(x=>x[0]).join(', ')}. Design for a household of ${h.size || 'several'} people. Prioritise practical storage, comfortable circulation and a cohesive premium-but-practical residential feel. Preserve the known architectural geometry from the uploaded floor plan; do not invent walls, windows or doors.`
  };
}

function renderAIBrief(brief){
  if(!brief) return '';
  const palette = (brief.colourPalette || []).map(c =>
    `<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;">
      <span style="width:24px;height:24px;border-radius:6px;background:${c.hex || '#ddd'};border:1px solid var(--line);display:inline-block;"></span>
      <span style="font-size:12px;">${c.name || ''}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);">${c.hex || ''}</span>
    </div>`
  ).join('');

  return `
    <div class="result-section-label">COPILOT INTELLIGENCE</div>
    <div class="result-plan" style="padding:16px;">
      <div style="font-size:18px;font-weight:700;margin-bottom:6px;">${brief.conceptName || 'Your personalised design'}</div>
      <div style="font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:14px;">${brief.designStory || ''}</div>

      <div style="font-size:11px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">Mood</div>
      <div class="chip-row">${(brief.mood || []).map(x=>`<span class="chip selected" style="cursor:default;">${x}</span>`).join('')}</div>

      <div style="font-size:11px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;color:var(--muted);margin:12px 0 8px;">Palette</div>
      ${palette}

      <div style="font-size:11px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;color:var(--muted);margin:12px 0 8px;">Design principles</div>
      <ul style="margin:0;padding-left:18px;font-size:12px;line-height:1.55;">
        ${(brief.designPrinciples || []).map(x=>`<li style="margin-bottom:5px;">${x}</li>`).join('')}
      </ul>

      <div class="note" style="margin-top:14px;margin-bottom:0;">
        This is the structured brief that the visual-generation engine will use. The live MVP sends this brief to your AI backend; the current offline demo uses a deterministic fallback so the UI remains testable without an API key.
      </div>
    </div>
  `;
}

async function generateAIDesign(){
  const d = state.data;
  d.aiStatus = 'loading';
  d.aiError = '';
  d.aiBrief = null;
  render();

  const project = buildProjectInput();
  const prompt = buildAIPrompt(project);
  d.aiPrompt = prompt;

  try {
    // Secure production architecture:
    // browser -> /api/design -> Copilot AI/image provider
    // Never place a private API key in this HTML file.
    const response = await fetch('/api/design', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({project, prompt})
    });

    if(!response.ok) throw new Error(`AI endpoint returned ${response.status}`);
    const payload = await response.json();
    if(!payload.brief) throw new Error('AI endpoint did not return a design brief.');

    d.aiBrief = payload.brief;
    d.aiImageUrl = payload.imageUrl || '';
    d.aiStatus = 'done';
  } catch(err) {
    // Offline/demo mode: still demonstrates the complete data -> brief pipeline.
    d.aiBrief = fallbackAIDesign(project);
    d.aiImageUrl = '';
    d.aiStatus = 'demo';
    d.aiError = 'Live AI endpoint not connected — showing the local demo design brain.';
  }

  render();
}


function submitContactForm(){
  const name = document.getElementById('contactName')?.value.trim() || '';
  const email = document.getElementById('contactEmail')?.value.trim() || '';
  const phone = document.getElementById('contactPhone')?.value.trim() || '';
  const message = document.getElementById('contactMessage')?.value.trim() || '';
  const status = document.getElementById('contactFormStatus');

  if(!name || !email){
    if(status){
      status.style.display = 'block';
      status.innerHTML = 'Please enter your name and email so we know how to contact you.';
    }
    return;
  }

  const subject = encodeURIComponent(`IDCopilot enquiry — ${name}`);
  const body = encodeURIComponent(
`Name: ${name}
Email: ${email}
Phone: ${phone || 'Not provided'}

Project:
${message || 'No additional message provided.'}

IDCopilot project:
${JSON.stringify(buildProjectInput(), null, 2)}`
  );

  window.location.href = `mailto:fredwongstudio@gmail.com?subject=${subject}&body=${body}`;
}

if(state.step === 4){
    const hasPlan = !!d.floorPlanImage;
    if(hasPlan && (!Array.isArray(d.calibPoints) || d.calibPoints.length !== 2)){

    }

    const a = d.calibPoints?.[0] || {x:20,y:50};
    const b = d.calibPoints?.[1] || {x:80,y:50};

    html = `
      <div class="eyebrow">Scale & Measurements</div>
      <h1>Set the scale of your floor plan</h1>
      <p class="sub">Place the reference line over a known dimension on your floor plan, then enter the actual measurement below.</p>

      ${hasPlan ? `
        <div class="plan-wrap" style="position:relative;overflow:hidden;background:#fff;">
          <div id="calib-surface"
               style="position:relative;width:100%;line-height:0;touch-action:none;user-select:none;">

                 preserveAspectRatio="none"
                 style="position:absolute;inset:0;width:100%;height:100%;z-index:10;overflow:visible;touch-action:none;pointer-events:auto;">

                    x1="${a.x}" y1="${a.y}"
                    x2="${b.x}" y2="${b.y}"

                      style="cursor:grab;pointer-events:auto;" />

              <circle class="calib-handle"
                      data-idx="1"
                      cx="${b.x}" cy="${b.y}" r="1.35"
                      fill="#3f8f6b" stroke="#fff" stroke-width="0.7"

                      style="cursor:grab;pointer-events:auto;" />

        </div>

          <label class="field-label">What does the reference line represent?</label>
          <div class="calib-input-row">
            <input type="number"
                   min="1"
                   step="1"
                   inputmode="numeric"
                   placeholder="e.g. 3425"
                   value="${d.calibLength || ''}"
                   oninput="state.data.calibLength=this.value;state.data.calibConfirmed=false;">

    setTimeout(() => {
      const svg = document.getElementById('calib-overlay');
      const line = document.getElementById('calib-line');
      if(!svg || !line) return;

      const getPoint = ev => {
        const r = svg.getBoundingClientRect();
        return {
          x: Math.max(0, Math.min(100, ((ev.clientX-r.left)/r.width)*100)),
          y: Math.max(0, Math.min(100, ((ev.clientY-r.top)/r.height)*100))
        };
      };

      const updateVisuals = () => {
        const pts = state.data.calibPoints;
        line.setAttribute('x1', pts[0].x);
        line.setAttribute('y1', pts[0].y);
        line.setAttribute('x2', pts[1].x);

        hs[1].setAttribute('cx', pts[1].x);
        hs[1].setAttribute('cy', pts[1].y);

          ev.preventDefault();
          ev.stopPropagation();
          const idx = Number(handle.dataset.idx);
          const move = e => {
            const p = getPoint(e);
            state.data.calibPoints[idx] = p;
            state.data.calibConfirmed = false;
            updateVisuals();

          const up = () => {

          const dy = p.y-start.y;

          state.data.calibPoints = [
            {
              x: Math.max(0, Math.min(100, originalA.x+dx)),
              y: Math.max(0, Math.min(100, originalA.y+dy))
            },
            {
              x: Math.max(0, Math.min(100, originalB.x+dx)),
              y: Math.max(0, Math.min(100, originalB.y+dy))
            }
          ];
          state.data.calibConfirmed = false;
          updateVisuals();
        };

        const up = () => {
          document.removeEventListener('pointermove', move);
          document.removeEventListener('pointerup', up);

      });
